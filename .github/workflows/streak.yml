name: Daily GitHub Streak

on:
  schedule:
    # Runs at 10:00 AM UTC every day
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub website

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to allow the bot to push commits
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Update streak log
        run: |
          echo "Contribution $(date)" >> streak-log.txt
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-log.txt
          git commit -m "Daily streak $(date)" || echo "No changes to commit"
          git push
